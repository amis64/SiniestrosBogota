<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Análisis de datos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<aside class="rail">
  <a class="rail-logo" href="{{ url_for('inicio') }}">
    <span class="logo-mark">◈</span>
    <span class="rail-text">DATA<b>MINING</b></span>
  </a>

  <nav class="rail-nav">
    <a href="{{ url_for('inicio') }}" class="{{ 'on' if request.endpoint == 'inicio' }}">
      <span class="num">00</span><span class="rail-text">Inicio</span>
    </a>
    <div class="rail-sep"><span class="rail-text">Análisis de datos</span></div>
    <a href="{{ url_for('poblacional.poblacional') }}" class="{{ 'on' if request.endpoint == 'poblacional.poblacional' }}">
      <span class="num">01</span><span class="rail-text">Poblacional</span>
    </a>
    <a href="{{ url_for('territorial.territorial') }}" class="{{ 'on' if request.endpoint == 'territorial.territorial' }}">
      <span class="num">02</span><span class="rail-text">Territorial</span>
    </a>
    <a href="{{ url_for('temporal.temporal') }}" class="{{ 'on' if request.endpoint == 'temporal.temporal' }}">
      <span class="num">03</span><span class="rail-text">Temporal</span>
    </a>
    <a href="{{ url_for('multivariada.multivariada') }}" class="{{ 'on' if request.endpoint == 'multivariada.multivariada' }}">
      <span class="num">04</span><span class="rail-text">Relacional y multivariada</span>
    </a>
  </nav>

  <div class="rail-foot"><span class="pulse"></span><span class="rail-text">datos.gov.co</span></div>
</aside>

<main class="stage">
  {% block contenido %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
